name: Update AirKorea Live Data & Charts

on:
  schedule:
    # 매일 한국시간(KST) 오전 09:00, 오후 19:00 자동 갱신 (UTC 00:00, 10:00)
    - cron: "0 0,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-airkorea-data
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Korean CJK font for 300 DPI matplotlib charts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest AirKorea API data and rebuild static bundle
        env:
          AIRKOREA_API_KEY: ${{ secrets.AIRKOREA_API_KEY }}
        run: |
          python fetch_data.py --timeout 8
          python build_static.py

      - name: Commit and push updated data & charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.csv data_meta.json index.html static/data/ static/charts/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          TIMESTAMP=$(TZ="Asia/Seoul" date "+%Y-%m-%d %H:%M KST")
          git commit -m "chore(data): auto-refresh AirKorea live data & charts (${TIMESTAMP})"
          git push origin main
